name: Renovate
on:
  workflow_dispatch:
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: renovate.json
          
